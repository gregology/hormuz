# Network protocol message definitions — single source of truth
# Defines messages between server and client over WebSocket (MessagePack encoded)

client_messages:
  input:
    description: One tick of player input; the server applies one per tick, in order
    fields:
      keys: uint8          # bitmask: 1=forward, 2=reverse, 4=left, 8=right, 16=fire
      mouse_x: float32
      mouse_y: float32
      action: uint8        # 0=none, 1=fire, 2=deploy, etc.
      throttle: float64    # ship throttle setting, -1 to 1
      autopilot: uint8     # tankers only
      sequence: uint32     # numbers commands so snapshots can say which were applied

  heartbeat:
    description: Keepalive ping
    fields: {}

  spectate_toggle:
    description: Switch between playing and spectating
    fields: {}

server_messages:
  snapshot_delta:
    description: Incremental world state update
    fields:
      tick: uint32
      entities: array      # [{id, components_changed}]
      removed: array       # [entity_ids]

  full_snapshot:
    description: Complete world state, every tick
    fields:
      tick: uint32
      entities: array
      controlled: array    # this client's [entity_id, last_command, buffered_commands], or nil

  events:
    description: The one-off events of one tick (explosion, delivered, projectile), played at that tick
    fields:
      tick: uint32
      events: array        # [[type, x, y, ...type-specific fields], ...]

  assign_vehicle:
    description: Tells client which entity they control
    fields:
      entity_id: uint32
      vehicle_type: string

  war_cost:
    description: Updated war cost counter
    fields:
      total_usd: uint64
      tankers_delivered: uint32
      tankers_sunk: uint32
      frigates_sunk: uint32
      shaheds_intercepted: uint32
      quadcopters_intercepted: uint32
      speedboats_sunk: uint32
      players_online: uint32
